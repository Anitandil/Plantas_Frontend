<ul class="nav nav-tabs">
  <li class="nav-item">
    <a class="nav-link" routerLink="/plantas" routerLinkActive="active">Plantas</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" routerLink="/origenes" routerLinkActive="active">Orígenes</a>
  </li>
</ul>

<div class="mt-3 d-flex flex-column gap-2">
  @if (esVistaPlantas) {
    <label class="form-label">Nombre</label>
    <input placeholder="Buscar por nombre..." class="form-control" [(ngModel)]="filtros.nombre">

    <label class="form-label">Clasificación</label>
    <select class="form-select" [(ngModel)]="filtros.clasificacion">
      <option value="">Todas</option>
      <option value="Arbol">Arbol</option>
      <option value="Arbusto">Arbusto</option>
      <option value="Mata">Mata</option>
      <option value="Hierba">Hierba</option>
    </select>

    <div class="d-flex gap-2">
      <div class="flex-fill">
        <label class="form-label">Ordenar por</label>
        <select class="form-select" [(ngModel)]="filtros.sortBy">
          <option value="id">ID</option>
          <option value="nombreCientifico">Nombre Científico</option>
          <option value="nombreVulgar">Nombre Vulgar</option>
          <option value="clasificacion">Clasificación</option>
        </select>
      </div>
      <div class="flex-fill">
        <label class="form-label">Orden</label>
        <select class="form-select" [(ngModel)]="filtros.order">
          <option value="asc">Ascendente</option>
          <option value="desc">Descendente</option>
        </select>
      </div>
    </div>

    <hr class="my-3">

    <button class="btn btn-primary w-100" (click)="buscar()">Buscar</button>
    <button class="btn btn-outline-secondary w-100" (click)="limpiar()">Limpiar</button>
    <button class="btn btn-success w-100" (click)="crearNuevo()">+ Agregar Planta</button>
  } @else {
    <hr class="my-3">
    <a class="btn btn-success w-100 mb-2" routerLink="/origenes/crear">
      + Nuevo Origen
    </a>
  }
</div>
